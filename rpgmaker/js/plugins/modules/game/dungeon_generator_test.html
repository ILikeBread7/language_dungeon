<script src="dungeon_generator.js"></script>
<script>
    const COLORS = new Map([
        [ 'space', 'blue' ],
        [ 'room', 'yellow' ],
        [ 'pass', 'green' ]
    ]);

    setTimeout(() => {
        const TILE_SIZE = 5;

        const canvas = document.createElement('canvas');
        const dungeon = DungeonGenerator.generate({
            width: 160,
            height: 100
        });
        console.dir(dungeon);

        canvas.width = dungeon.w * TILE_SIZE;
        canvas.height = dungeon.h * TILE_SIZE;

        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        dungeon.tiles.forEach((row, rowIndex) => {
            row.forEach((tile, columnIndex) => {
                ctx.fillStyle = COLORS.get(tile);
                ctx.fillRect(
                    columnIndex * TILE_SIZE,
                    rowIndex * TILE_SIZE,
                    TILE_SIZE,
                    TILE_SIZE
                );
            });
        });

        const blocks = DungeonGenerator._createBlocks(
            dungeon.tiles,
            12,
            10
        );
        console.dir(blocks);
        console.log(blocks.filter(block => block.w < 10 || block.h < 10));

        for (const block of blocks) {
            const color = `hsla(${Math.random() * 360}deg, 50%, ${Math.random() * 50 + 25}%, 75%)`;
            ctx.fillStyle = color;
            ctx.fillRect(
                block.x * TILE_SIZE,
                block.y * TILE_SIZE,
                block.w * TILE_SIZE,
                block.h * TILE_SIZE
            );
        }
    })
</script>
