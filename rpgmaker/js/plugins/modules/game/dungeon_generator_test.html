<script src="dungeon_generator.js"></script>
<script>
    const COLORS = new Map([
        [ 'space', 'blue' ],
        [ 'room', 'yellow' ],
        [ 'pass', 'green' ]
    ]);

    setTimeout(() => {
        const TILE_SIZE = 5;

        const canvas = document.createElement('canvas');
        const options = {
            width: 160,
            height: 100,
            mapWidth: 180,
            mapHeight: 120,
            minRooms: 8,
            maxRooms: 12,
            minRoomSize: 10,
            maxRoomSize: 80
        };
        const dungeon = DungeonGenerator.generate(options);
        console.dir(dungeon);

        canvas.width = dungeon.w * TILE_SIZE;
        canvas.height = dungeon.h * TILE_SIZE;

        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        dungeon.tiles.forEach((row, rowIndex) => {
            row.forEach((tile, columnIndex) => {
                ctx.fillStyle = COLORS.get(tile);
                ctx.fillRect(
                    columnIndex * TILE_SIZE,
                    rowIndex * TILE_SIZE,
                    TILE_SIZE,
                    TILE_SIZE
                );
            });
        });

        console.log(dungeon.blockConnections)
        dungeon.blockConnections.forEach(([ block1, block2 ]) => {
            console.log(block1.x, block1.y, block2.x, block2.y)
            ctx.beginPath();
            ctx.moveTo((block1.x + block1.w / 2) * TILE_SIZE, (block1.y + block1.h / 2) * TILE_SIZE);
            ctx.lineTo((block2.x + block2.w / 2) * TILE_SIZE, (block2.y + block2.h / 2) * TILE_SIZE);
            ctx.stroke();
        });

        // const blocks = DungeonGenerator._createBlocks(
        //     dungeon.tiles,
        //     options,
        //     12,
        //     10
        // );
        // console.dir(blocks);
        // console.log(blocks.filter(block => block.w < 10 || block.h < 10));

        const blocks = dungeon.blocks;
        for (const block of blocks) {
            const color = `hsla(${Math.random() * 360}deg, 50%, ${Math.random() * 50 + 25}%, 50%)`;
            ctx.fillStyle = color;
            ctx.fillRect(
                block.x * TILE_SIZE,
                block.y * TILE_SIZE,
                block.w * TILE_SIZE,
                block.h * TILE_SIZE
            );
        }
    })
</script>
