<style>
    body {
        margin: 0;
        overflow: hidden;
    }

    body::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background: plum;
        opacity: 0.6;
        z-index: -1;
    }

    openable-component {
        --transition-time: 0.5s;
    }

    main-menu-component .explanation,
    main-menu-component .choices-list {
        transition: transform calc(var(--transition-time) / 2);
    }

    openable-component[data-target-state="closed"] main-menu-component .choices-list {
        transform: translateX(-100%);
    }

    openable-component[data-target-state="closed"] main-menu-component .explanation {
        transform: translateX(100%);
    }

    .centered {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .full-width {
        width: 100%;
    }

    :is(
        are-you-sure-component,
        options-menu-component
    ) .choices-list {
        width: 50%;
        margin: auto;
    }

    .danger {
        background: orangered;
    }
    
    .danger[data-selected="selected"] {
        background: orange;
    }

    scrollable-list-component .choices-list {
        transition: top 0.1s;
    }

    scrollable-list-component .choices-list.page-scroll {
        transition: none;
    }

    scrollable-list-component .container:has(.page-scroll-down) {
        animation: shake-right 0.15s;
    }

    scrollable-list-component .container:has(.page-scroll-up) {
        animation: shake-left 0.15s;
    }

    @keyframes shake-right {
        50% {
            transform: rotate(2deg);
        }
    }

    @keyframes shake-left {
        50% {
            transform: rotate(-2deg);
        }
    }

    .scroll-up-indicator,
    .scroll-down-indicator {
        z-index: 2;
    }

    scrollable-list-component .scroll-up-indicator::before {
        animation: floating-down 0.75s linear alternate infinite;
    }
    
    scrollable-list-component .scroll-down-indicator::before {
        animation: floating-up 0.75s linear alternate infinite;
    }

    @keyframes floating-down {
        0% {
            transform: translateY(-33%);
        }
        50% {
            transform: translateY(16%);
        }
        100% {
            transform: translateY(-33%);
        }
    }

    @keyframes floating-up {
        0% {
            transform: translateY(33%);
        }
        50% {
            transform: translateY(-16%);
        }
        100% {
            transform: translateY(33%);
        }
    }

    scrollable-list-component {
        height: 100%;
    }

    .container {
        position: relative;
        top: 5%;
        height: 90%;
    }

    .item-use-dialog .explanation {
        top: initial;
        bottom: anchor(--choices-list top);
        height: fit-content;
        padding: 1lh 0;
    }

    scrollable-list-component {
        --scroll-threshold-px: 50;
        --edge-height: calc(var(--scroll-threshold-px) * 1px);
    }

    scrollable-list-component:has(.scroll-up-indicator.visible) .container::before,
    scrollable-list-component:has(.scroll-down-indicator.visible) .container::after {
        content: '';
        position: absolute;
        width: 100%;
        height: var(--edge-height);
        z-index: 1;
        pointer-events: none;
    }

    scrollable-list-component:has(.scroll-up-indicator.visible) .container::before {
        top: 0px;
        background: linear-gradient(rgba(0, 0, 0, 1), rgba(0, 0, 0, 0));
    }

    scrollable-list-component:has(.scroll-down-indicator.visible) .container::after {
        bottom: 0px;
        background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 1));
    }

    /* scrollable-list-component {
        --direction: horizontal;
    } */

    options-menu-component .option-text::after {
        content: ':';
    }

    options-menu-component {
        & .options-container {
            display: flex;
            flex-direction: column;
            gap: 0.5lh;
            width: 50%;
            margin: auto;
        }

        & .option-container {
            display: flex;
            flex-direction: row;
            min-height: 1.5lh;
            align-items: center;
            gap: 0.25em;
        }

        --text-width: 20%;

        & .option-text {
            flex-basis: var(--text-width);
            text-align: right;
        }

        & .input {
            flex-basis: calc(100% - var(--text-width));
        }
    }

    .slider {
        width: 100%;
    }

    .radio {
        display: inline;
        --base-color: hsl(0, 0%, 50%);
        background: linear-gradient(
            hsl(from var(--base-color) h s calc(l * 0.5)),
            var(--base-color)
        );
        cursor: pointer;
        color: darkgray;
        padding: 0.1em 0.15em;
        
        &[data-selected="selected"] {
            --base-color: hsl(120, 50%, 60%);
            color: whitesmoke;
        }

        --border-radius: 0.5em;

        &:first-of-type {
            border-top-left-radius: var(--border-radius);
        }

        &:last-of-type {
            border-top-right-radius: var(--border-radius);
        }

        &:not(:last-of-type) {
            border-right: solid 1px black; 
        }
    }
</style>
<script type="module" src="menu_test.js"></script>
